[project]
name = "cartera"
version = "0.1.0"
description = "Mi cartera en dólares: seguimiento en USD de un patrimonio personal (versión servidor)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "filelock>=3.16,<4",
    "tzdata>=2024.1; sys_platform == 'win32'",  # Windows no trae la base de zonas horarias
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["referencia"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el texto en español usa «−», «×» y «·» a propósito

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["cartera/motor", "cartera/datos"]
strict = true
